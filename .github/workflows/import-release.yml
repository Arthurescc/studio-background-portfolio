name: Import release archives

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to import again
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: import-release
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the library
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install image tools
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0" "XlsxWriter==3.2.5"

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            tag="${{ github.event.release.tag_name }}"
          else
            tag="${{ inputs.release_tag }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download ZIP archives
        shell: bash
        run: |
          mkdir -p /tmp/studio-release
          gh release download "${{ steps.release.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.zip' \
            --dir /tmp/studio-release

      - name: Reserve every image URL from ZIP filenames
        run: |
          python tools/preallocate_urls.py \
            --input-dir /tmp/studio-release \
            --tag "${{ steps.release.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY"
          python tools/export_urls.py \
            --catalog docs/data/catalog.json \
            --xlsx docs/downloads/photo-urls.xlsx \
            --csv docs/downloads/photo-urls.csv

      - name: Publish the URL list first
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/catalog.json docs/downloads
          if git diff --cached --quiet; then
            echo "URL directory already current."
          else
            git commit -m "Reserve URLs for ${{ steps.release.outputs.tag }}"
            git push
          fi

      - name: Load images into their reserved URLs
        run: |
          mkdir -p /tmp/studio-originals
          python tools/import_release.py \
            --input-dir /tmp/studio-release \
            --tag "${{ steps.release.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --originals-dir /tmp/studio-originals

      - name: Upload every original to its reserved URL
        shell: bash
        run: |
          find /tmp/studio-originals -maxdepth 1 -type f -print0 | \
            xargs -0 -r -n 20 -P 4 \
            gh release upload "${{ steps.release.outputs.tag }}" \
              --repo "$GITHUB_REPOSITORY" --clobber

      - name: Export the complete URL list
        run: |
          python tools/export_urls.py \
            --catalog docs/data/catalog.json \
            --xlsx docs/downloads/photo-urls.xlsx \
            --csv docs/downloads/photo-urls.csv

      - name: Publish previews and completed dimensions
        shell: bash
        run: |
          git add docs/data docs/thumbnails docs/downloads
          if git diff --cached --quiet; then
            echo "No gallery changes detected."
            exit 0
          fi
          git commit -m "Import release ${{ steps.release.outputs.tag }}"
          git push
