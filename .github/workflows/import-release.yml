name: Import release archives

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to import again
        required: true
        type: string
      range_start:
        description: First numeric JPG to import (optional)
        required: false
        default: "1"
        type: string
      range_end:
        description: Last numeric JPG to import (optional)
        required: false
        default: "15000"
        type: string

permissions:
  contents: write

concurrency:
  group: import-release
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the library
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0" "XlsxWriter==3.2.5"

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            tag="${{ github.event.release.tag_name }}"
          else
            tag="${{ inputs.release_tag }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download ZIP archives
        shell: bash
        run: |
          mkdir -p /tmp/studio-release
          if [[ "${{ steps.release.outputs.tag }}" == "photos-1-15000" ]]; then
            start="${{ inputs.range_start || '1' }}"
            end="${{ inputs.range_end || '15000' }}"
            for lower in $(seq "$start" 500 "$end"); do
              upper=$((lower + 499))
              [[ "$upper" -gt "$end" ]] && upper="$end"
              archive="${lower}-${upper}.zip"
              gh release download "${{ steps.release.outputs.tag }}" \
                --repo "$GITHUB_REPOSITORY" \
                --pattern "$archive" \
                --dir /tmp/studio-release
            done
          else
            gh release download "${{ steps.release.outputs.tag }}" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern '*.zip' \
              --dir /tmp/studio-release
          fi

      - name: Reserve every image URL from ZIP filenames
        shell: bash
        run: |
          if [[ "${{ steps.release.outputs.tag }}" == "photos-1-15000" ]]; then
            python tools/reserve_numeric_library.py --repo "$GITHUB_REPOSITORY"
          else
            python tools/preallocate_urls.py \
              --input-dir /tmp/studio-release \
              --tag "${{ steps.release.outputs.tag }}" \
              --repo "$GITHUB_REPOSITORY"
          fi
          python tools/export_urls.py \
            --catalog docs/data/catalog.json \
            --xlsx docs/downloads/photo-urls.xlsx \
            --csv docs/downloads/photo-urls.csv

      - name: Publish the URL list first
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/catalog.json docs/downloads
          if git diff --cached --quiet; then
            echo "URL directory already current."
          else
            git commit -m "Reserve URLs for ${{ steps.release.outputs.tag }}"
            git push
          fi

      - name: Load images and build previews
        shell: bash
        run: |
          if [[ "${{ steps.release.outputs.tag }}" == "photos-1-15000" ]]; then
            python tools/import_reserved_numeric.py \
              --input-dir /tmp/studio-release \
              --tag "${{ steps.release.outputs.tag }}" \
              --repo "$GITHUB_REPOSITORY" \
              --start "${{ inputs.range_start || '1' }}" \
              --end "${{ inputs.range_end || '15000' }}"
          else
            python tools/import_release.py \
              --input-dir /tmp/studio-release \
              --tag "${{ steps.release.outputs.tag }}" \
              --repo "$GITHUB_REPOSITORY" \
              --originals-dir /tmp/studio-originals
          fi

      - name: Export the complete URL list
        run: |
          python tools/export_urls.py \
            --catalog docs/data/catalog.json \
            --xlsx docs/downloads/photo-urls.xlsx \
            --csv docs/downloads/photo-urls.csv

      - name: Publish previews and completed dimensions
        shell: bash
        run: |
          git add docs/data docs/thumbnails docs/downloads
          if git diff --cached --quiet; then
            echo "No gallery changes detected."
            exit 0
          fi
          git commit -m "Import release ${{ steps.release.outputs.tag }}"
          git push
