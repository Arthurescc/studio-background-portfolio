name: Pre-register 15000 fixed photo URLs

on:
  push:
    branches: [main]
    paths:
      - "tools/reserve_numeric_library.py"
      - ".github/workflows/reserve-numeric-library.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reserve-numeric-library
  cancel-in-progress: false

jobs:
  reserve:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the library
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Excel exporter
        run: python -m pip install --disable-pip-version-check "XlsxWriter==3.2.5"

      - name: Pre-register numeric filenames and export the URL list
        run: |
          python tools/reserve_numeric_library.py
          python tools/export_urls.py \
            --catalog docs/data/catalog.json \
            --xlsx docs/downloads/photo-urls.xlsx \
            --csv docs/downloads/photo-urls.csv

      - name: Publish the pre-registration catalog
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/catalog.json docs/downloads/photo-urls.xlsx docs/downloads/photo-urls.csv
          if git diff --cached --quiet; then
            echo "Reservation catalog already current."
            exit 0
          fi
          git commit -m "Pre-register 15000 fixed photo URLs"
          git push
